# The oracle suite (tests/oracle.rs) is a list of the oracle's tests ported as
# black-box screen tests; a test that is pending, todo or red makes the binary
# fail by design, so the default profile leaves it out and the gate stays the
# crate's own tests. Run the suite, and read it, with:
#
#   acargo nextest run --profile oracle --no-fail-fast
#   python3 -I tests/oracle/tools/summary.py            (pass / pending / todo / red per shard)
#
# The screen tests whose oracle behaviour needs a slice that does not exist yet
# are marked `pending(owner, reason)` in tests/pages/agents.rs: they fail by design,
# printing PENDING[owner]: reason. They stay in the tree unweakened and run in
# the profile `pending`, out of the default one, so that the default run is
# green and tests/rules/rules.rs keeps this list and the markers equal:
#
#   acargo nextest run --profile pending --no-fail-fast     (every one must fail, with its owner)

# A test that hangs (a wait on a thread that never answers, a PTY scenario whose
# child never exits) must not eat a run: nextest prints SLOW for a test still
# running after 30 s (the slowest passing test of the whole suite is under 20 s
# even on a loaded machine) and kills it as TIMEOUT after four periods, 120 s.
# The other profiles inherit it; land-check lists a TIMEOUT like a FAIL.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }
default-filter = "not binary(oracle) and not (binary(screens) and (test(=agents::agents_overview_details_render_markdown) or test(=agents::agents_overview_preview_links_survive_wrapping_and_clipping) or test(=agents::live_center_fixed_shortcuts_yield_to_configured_actions)))"

[profile.pending]
default-filter = "binary(screens) and (test(=agents::agents_overview_details_render_markdown) or test(=agents::agents_overview_preview_links_survive_wrapping_and_clipping) or test(=agents::live_center_fixed_shortcuts_yield_to_configured_actions))"
fail-fast = false
status-level = "fail"
final-status-level = "fail"

[profile.oracle]
default-filter = "binary(oracle)"
fail-fast = false
status-level = "fail"
final-status-level = "fail"

[profile.oracle.junit]
path = "junit.xml"
store-success-output = true
store-failure-output = true
