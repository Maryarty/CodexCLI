# The oracle suite (tests/oracle.rs) is a list of the oracle's tests ported as
# black-box screen tests; a test that is pending, todo or red makes the binary
# fail by design, so the default profile leaves it out and the gate stays the
# crate's own tests. Run the suite, and read it, with:
#
#   acargo nextest run --profile oracle --no-fail-fast
#   python3 -I tests/oracle/tools/summary.py            (pass / pending / todo / red per shard)
#
# The screen tests whose oracle behaviour needs a slice that does not exist yet
# are marked `pending(owner, reason)` in tests/agents.rs: they fail by design,
# printing PENDING[owner]: reason. They stay in the tree unweakened and run in
# the profile `pending`, out of the default one, so that the default run is
# green and tests/rules.rs keeps this list and the markers equal:
#
#   acargo nextest run --profile pending --no-fail-fast     (every one must fail, with its owner)
[profile.default]
default-filter = "not binary(oracle) and not (binary(screens) and (test(=agents::agents_overview_details_render_markdown) or test(=agents::agents_overview_preview_links_survive_wrapping_and_clipping) or test(=agents::filtered_dashboard_actions_use_configured_shortcuts) or test(=agents::live_center_fixed_shortcuts_yield_to_configured_actions) or test(=agents::live_center_hints_follow_configured_bindings) or test(=agents::live_center_page_keys_and_wrap_follow_the_list_keymap) or test(=agents::live_center_pages_visible_rows_while_reconnecting) or test(=agents::older_server_notice_truncates_in_narrow_overview)))"

[profile.pending]
default-filter = "binary(screens) and (test(=agents::agents_overview_details_render_markdown) or test(=agents::agents_overview_preview_links_survive_wrapping_and_clipping) or test(=agents::filtered_dashboard_actions_use_configured_shortcuts) or test(=agents::live_center_fixed_shortcuts_yield_to_configured_actions) or test(=agents::live_center_hints_follow_configured_bindings) or test(=agents::live_center_page_keys_and_wrap_follow_the_list_keymap) or test(=agents::live_center_pages_visible_rows_while_reconnecting) or test(=agents::older_server_notice_truncates_in_narrow_overview))"
fail-fast = false
status-level = "fail"
final-status-level = "fail"

[profile.oracle]
default-filter = "binary(oracle)"
fail-fast = false
status-level = "fail"
final-status-level = "fail"

[profile.oracle.junit]
path = "junit.xml"
store-success-output = true
store-failure-output = true
