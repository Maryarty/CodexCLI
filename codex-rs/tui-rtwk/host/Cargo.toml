[package]
name = "codex-rtwk"
version.workspace = true
edition.workspace = true
license.workspace = true

build = "build.rs"

[[bin]]
name = "codex-rtwk"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1"
codex-app-server-client = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/app-server-client" }
codex-app-server-daemon = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/app-server-daemon" }
codex-app-server-protocol = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/app-server-protocol" }
codex-arg0 = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/arg0" }
codex-config = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/config" }
codex-core = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/core" }
codex-exec-server = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/exec-server" }
codex-feedback = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/feedback" }
codex-features = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/features" }
codex-git-utils = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/git-utils" }
codex-http-client = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/http-client" }
codex-install-context = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/install-context" }
codex-login = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/login" }
codex-protocol = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/protocol" }
codex-utils-absolute-path = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/utils/absolute-path" }
codex-utils-path-uri = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/utils/path-uri" }
codex-utils-cli = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/utils/cli" }
codex-utils-path = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/utils/path-utils" }
codex-worktree = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/worktree" }
codex-tui-rtwk = { path = ".." }
codex-tui-core = { path = "../core" }
rtwk = { workspace = true }
rtwk-tokio = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dunce = "1.0.4"
futures = { version = "0.3", default-features = false }
serde_json = "1"
tempfile = "3.23.0"
url = "2"
webbrowser = "1.2.2"
which = "8"
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
