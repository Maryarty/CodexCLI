[package]
name = "codex-rtwk"
version.workspace = true
edition.workspace = true
license.workspace = true

build = "build.rs"

[[bin]]
name = "codex-rtwk"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1"
codex-app-server-client = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/app-server-client" }
codex-app-server-daemon = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/app-server-daemon" }
codex-app-server-protocol = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/app-server-protocol" }
codex-backend-client = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/backend-client" }
codex-arg0 = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/arg0" }
codex-build-info = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/build-info" }
codex-config = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/config" }
codex-core = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/core" }
codex-exec-server = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/exec-server" }
codex-feedback = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/feedback" }
codex-features = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/features" }
codex-git-utils = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/git-utils" }
codex-http-client = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/http-client" }
codex-install-context = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/install-context" }
codex-login = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/login" }
codex-protocol = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/protocol" }
codex-realtime-webrtc = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/realtime-webrtc" }
codex-rollout = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/rollout" }
codex-state = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/state" }
codex-terminal-detection = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/terminal-detection" }
codex-utils-absolute-path = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/utils/absolute-path" }
codex-utils-path-uri = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/utils/path-uri" }
codex-utils-oss = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/utils/oss" }
codex-utils-cli = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/utils/cli" }
codex-model-provider = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/model-provider" }
codex-model-provider-info = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/model-provider-info" }
codex-utils-sandbox-summary = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/utils/sandbox-summary" }
codex-utils-path = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/utils/path-utils" }
codex-worktree = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/worktree" }
codex-tui-rtwk = { path = ".." }
codex-tui-core = { path = "../core" }
rtwk = { workspace = true }
rtwk-tokio = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dunce = "1.0.4"
futures = { version = "0.3", default-features = false }
image = { version = "0.25.9", default-features = false, features = ["png", "webp"] }
png = "0.18.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.23.0"
thiserror = "2"
toml = "0.9.5"
toml_edit = "0.24.0"
url = "2"
uuid = { version = "1", features = ["v4"] }
webbrowser = "1.2.2"
which = "8"
tracing = "0.1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
# `device_login::has_http_handler`: whether a program is registered for `http`;
# `analytics::clock`: the short time pattern of the user's locale.
# `small::windows_pipe`: authenticated, deadline-bounded IDE context.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

# `analytics::clock`: the clock preference of the user's locale (the oracle's own features).
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDateFormatter", "NSFormatter", "NSLocale", "NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "4.4.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util"] }
codex-ollama = { path = "/Users/admin/.cache/codexcli/backend-pin/codex-rs/ollama" }
