[workspace]
resolver = "2"
members = ["host", "core"]

# The rtwk pin: the one place the checkout is named (docs/rtwk-port/RTWK_REF
# names its commit; tests/rules/pin.rs checks both). A symlink inside this
# workspace does not work: cargo makes path dependencies under the workspace
# directory members, and rtwk's crates then inherit from this manifest.
[workspace.dependencies]
rtwk = { path = "/Users/admin/.cache/codexcli/rtwk-pin-5001/crates/rtwk" }
rtwk-core = { path = "/Users/admin/.cache/codexcli/rtwk-pin-5001/crates/rtwk-core" }
rtwk-render = { path = "/Users/admin/.cache/codexcli/rtwk-pin-5001/crates/rtwk-render" }
rtwk-rich = { path = "/Users/admin/.cache/codexcli/rtwk-pin-5001/crates/rtwk-rich" }
rtwk-term = { path = "/Users/admin/.cache/codexcli/rtwk-pin-5001/crates/rtwk-term" }
rtwk-test = { path = "/Users/admin/.cache/codexcli/rtwk-pin-5001/crates/rtwk-test" }
rtwk-tokio = { path = "/Users/admin/.cache/codexcli/rtwk-pin-5001/crates/rtwk-tokio" }

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(codex_bazel)'] }

[workspace.lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
disallowed_methods = "deny"
expect_used = "deny"
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"
unwrap_used = "deny"

[package]
name = "codex-tui-rtwk"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_tui_rtwk"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
codex-app-server-protocol = { path = "/Users/admin/.cache/codexcli/backend-pin-e8ddca3f/codex-rs/app-server-protocol" }
codex-config = { path = "/Users/admin/.cache/codexcli/backend-pin-e8ddca3f/codex-rs/config" }
codex-file-search = { path = "/Users/admin/.cache/codexcli/backend-pin-e8ddca3f/codex-rs/file-search" }
codex-message-history = { path = "/Users/admin/.cache/codexcli/backend-pin-e8ddca3f/codex-rs/message-history" }
codex-protocol = { path = "/Users/admin/.cache/codexcli/backend-pin-e8ddca3f/codex-rs/protocol" }
codex-shell-command = { path = "/Users/admin/.cache/codexcli/backend-pin-e8ddca3f/codex-rs/shell-command" }
codex-tui-core = { path = "core" }
codex-utils-path = { path = "/Users/admin/.cache/codexcli/backend-pin-e8ddca3f/codex-rs/utils/path-utils" }
codex-utils-elapsed = { path = "/Users/admin/.cache/codexcli/backend-pin-e8ddca3f/codex-rs/utils/elapsed" }
rtwk = { workspace = true }
rtwk-core = { workspace = true }
rtwk-render = { workspace = true }
# `math`: the Markdown extensions `MdExtensions::MATH` and `MATH_BRACKETS` (`$..$`, `$$..$$`,
# `\(..\)`, `\[..\]` parse as `MdInline::Math`, which the view draws as Unicode with rtwk-math):
# the oracle's markdown_render/math.rs reads the same four forms (widgets/markdown.rs `stream`).
rtwk-rich = { workspace = true, features = ["math"] }
rtwk-tokio = { workspace = true }
futures = { version = "0.3", default-features = false }
# The clipboard image read (services/clipboard/read): the oracle's own features.
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
libc = "0.2"
# The plain copy of backend banners can contain clickable web destinations.
linkify = "0.11"
# The HTML flavour of a Markdown copy (services/clipboard/html): the oracle's own features.
pulldown-cmark = { version = "0.10", default-features = false, features = ["html"] }
semver = "1.0"
# The generic picker list reads its debug fixtures (widgets/picker/list.rs).
serde = { version = "1", features = ["derive"] }
# `preserve_order`: a tool call's arguments keep the order the model wrote them (the oracle's
# `Called cua_repl.js({"title":..,"code":..})` spelling).
serde_json = { version = "1", features = ["preserve_order"] }
shlex = "1.3"
# The external editor canonicalises its directory without `\\?\` on Windows (services/editor).
dunce = "1.0.4"
# `/export` writes through a temporary file (services/transcript_file).
tempfile = "3.23.0"
tracing = "0.1"
# The link policy of that HTML: a destination must parse as http or https.
url = "2"
# A feature pin (what cargo-hakari does for a big workspace, by hand), no code of ours uses
# it: rtwk-test's dev-dependency `insta` turns on similar's `inline` in test builds only, and
# then codex-core and ~60 crates above it are compiled twice, once for the tests and once
# for `build -p codex-rtwk --bin codex-rtwk` (docs/rtwk-port/build-speed.md). Naming the
# feature here makes every build of this workspace resolve similar the same way.
similar = { version = "2", features = ["inline"] }
tokio = { version = "1", features = ["io-util", "process", "rt-multi-thread", "sync", "time"] }

# The native clipboard (services/clipboard): the oracle's own features, none on Android.
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }

# The macOS pasteboard image read (services/clipboard/read/macos): the oracle's own features.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSEnumerator", "NSString"] }

[dev-dependencies]
# The module lists of the test roots, written from the test files (test-mods/build.rs).
tui-test-mods = { path = "test-mods" }
pretty_assertions = "1.4.1"
tokio = { version = "1", features = ["macros", "test-util"] }
rtwk-term = { workspace = true }
rtwk-test = { workspace = true }

[profile.dev]
debug = false
# No incremental cache: worktree targets reached 40 GB (2026-11-18) and
# sccache cannot cache incremental builds anyway.
incremental = false
# `rust-objcopy` aborts on every link (broken libLLVM.dylib in the toolchain
# component); nothing to strip with debug off, so skip the subprocess
# (build-speed.md "Proposals" 2, the person 2026-11-22).
strip = "none"

[profile.dev.package."*"]
debug = false

# Incremental for the workspace's own crates only: they are what an edit
# rebuilds, and sccache does not cache them across edits anyway; every
# dependency stays non-incremental and cached by sccache (build-speed.md
# "Proposals" 2, the person 2026-11-22).
[profile.dev.package.codex-tui-rtwk]
incremental = true

[profile.dev.package.codex-tui-core]
incremental = true

[profile.dev.package.codex-rtwk]
incremental = true

[patch.crates-io]
# Uncomment to debug local changes.
# ratatui = { path = "../../ratatui" }
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "ed1cdab335221515706178d68495bba2aed1924f" }
# SQLx 0.9.0 excludes libsqlite3-sys 0.39. Keep its driver and Core traits on
# the same reviewed source until a release includes transact-rs/sqlx#4502.
sqlx-core = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-sqlite = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "7447c427513cfe685f236e1ac0513c4ea3dd9c0b" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "bc589d684755a8c02da0fc7e58d0861cbfc306f1" }
v8 = { git = "https://github.com/openai-oss-forks/rusty_v8.git", rev = "90a65f887a0c0f048f3784afbcb320b373c8a2e0" }

# Uncomment to debug local changes.
# rmcp = { path = "../../rust-sdk/crates/rmcp" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "bc589d684755a8c02da0fc7e58d0861cbfc306f1" }

[[test]]
name = "screens"
path = "tests/screens.rs"

# The test targets. Every [[test]] is a binary (a rustc run and a link of the whole
# dependency set, ~3 s each, relinked after every edit of the library), so files are
# modules of a few roots instead of a target each (docs/rtwk-port/build-speed.md):
#   screens  tests/screens.rs        the page, sheet and app tests (every file of tests/{pages,sheets,app}
#                                    without the marker `// test root: pages`)
#   pages    tests/pages.rs          mouse, composer draft, the rtwk gap probes (files with the marker)
#   shell    tests/shell.rs          the services/shell tests
#   oracle   tests/oracle.rs         the oracle shards (tests/oracle/*.rs)
#   rules    tests/rules/main.rs     the static rules (pin, layers, theme, fixtures, carried, ...)
#   kit_proof, oracle, scenarios     as before
# The modules of screens, pages, oracle and shell are the files: `test-mods` (a dev-dependency, below)
# writes them from tests/{app,pages,sheets,oracle,services}, so a new test file edits no root
# (tests/rules/test_roots.rs: no root holds a hand-written `mod` line of a test file).

[[test]]
name = "pages"
path = "tests/pages.rs"

[[test]]
name = "shell"
path = "tests/shell.rs"

[[test]]
name = "rules"
path = "tests/rules/main.rs"

# The pty scenarios: both binaries against one mocked model, compared at
# checkpoints. Opt-in (every scenario test is #[ignore]); see
# tests/scenarios/README.md.
[[test]]
name = "scenarios"
path = "tests/scenarios/main.rs"

# The screen-test kit (tests/kit): its proof (all green), and the oracle
# suite of black-box shards (tests/oracle/*.rs, ported by the test swarm).
# The suite holds pending and todo tests by design: it fails until the
# slices land, so the default nextest profile leaves it out
# (.config/nextest.toml); `acargo nextest run --profile oracle` runs it.
[[test]]
name = "kit_proof"
path = "tests/kit_proof.rs"

[[test]]
name = "oracle"
path = "tests/oracle.rs"

# Release builds strip symbols (the person, 2026-11-19): -84 MB, and rtwk's atexit/dladdr scan
# at terminal open costs ~3.5 ms only in an unstripped binary (perf-size research).
[profile.release]
strip = "symbols"

# The shipped binary: `cargo build --profile dist`. Thin LTO and fewer codegen
# units cost build time, so the default release (measuring, CI) stays without.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 4
