[package]
name = "codex-tui-core"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_tui_core"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

# The core of `codex-tui-rtwk`: models, `apply`, tickets, the protocol mapping.
# It has no direct dependency but the protocol, serde and test helpers
# (`tests/layers.rs` keeps the list); the protocol crate pulls a runtime in
# transitively, so the sources name none and the lints ban the IO calls. The
# compiler refuses any widget here.
[dependencies]
codex-app-server-protocol = { path = "/Users/admin/.cache/codexcli/backend-pin-e8ddca3f/codex-rs/app-server-protocol" }
codex-protocol = { path = "/Users/admin/.cache/codexcli/backend-pin-e8ddca3f/codex-rs/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `validate_external_url` of the app link requests (oracle `bottom_pane/app_link_view.rs`): the
# oracle parses the link with this crate, and a hand parser would differ at the edges.
url = "2"

[dev-dependencies]
pretty_assertions = "1.4.1"
# The module list of `tests/all.rs`, written from the files (test-mods/build.rs).
tui-test-mods = { path = "../test-mods" }

# The integration tests are one binary (tests/all.rs lists the files as modules): one rustc
# run and one link instead of 25 (docs/rtwk-port/build-speed.md). A new tests/<name>.rs is a
# module by being a file (`tui_test_mods::core_all!`), no line.
[[test]]
name = "all"
path = "tests/all.rs"
